server {
    listen 80;
    listen [::]:80;
    server_name veo3.1nutnhan.com;

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "veo3 edge ok\n";
    }

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name veo3.1nutnhan.com;

    ssl_certificate /etc/letsencrypt/live/veo3-system/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veo3-system/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/veo3.1nutnhan.com.access.log;
    error_log /var/log/nginx/veo3.1nutnhan.com.error.log;
    client_max_body_size 128m;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "veo3 edge ok\n";
    }

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location = /upscale {
        return 308 https://bb.1nutnhan.com$request_uri;
    }

    location ^~ /upscale/ {
        return 308 https://bb.1nutnhan.com$request_uri;
    }

    location /api/ext/socket {
        proxy_pass http://127.0.0.1:17311;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        client_max_body_size 128M;
    }

    location / {
        proxy_pass http://127.0.0.1:17311;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        client_max_body_size 128M;
    }
}
